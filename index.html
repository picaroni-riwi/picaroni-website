<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Validación Tailwind v4</title>
  <link href="dist/output.css" rel="stylesheet">
</head>
<body class="bg-slate-900 text-white min-h-screen">
  <main class="w-full">
     <!--tarjetas de estado de impacto-->
    <section
      id="impact-stats"
      aria-label="Estadísticas de impacto"
      class="w-full border-t border-gray-200 bg-gray-100 px-6 py-10"
    >
      <div class="grid grid-cols-2 gap-6 text-center md:grid-cols-4">
        <div>
          <p class="text-4xl font-bold text-slate-700">18</p>
          <p class="text-xs uppercase tracking-widest text-gray-600">Especies protegidas</p>
        </div>
        <div>
          <p class="text-4xl font-bold text-slate-700">6</p>
          <p class="text-xs uppercase tracking-widest text-gray-600">Hábitats activos</p>
        </div>
        <div>
          <p class="text-4xl font-bold text-slate-700">320</p>
          <p class="text-xs uppercase tracking-widest text-gray-600">Voluntarios / año</p>
        </div>
        <div>
          <p class="text-4xl font-bold text-slate-700">100%</p>
          <p class="text-xs uppercase tracking-widest text-gray-600">Fondos verificables</p>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
